name: test

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', snapshot]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Install GNU Global
        run: sudo apt-get update && sudo apt-get install -y global
      # Coverage on one entry only: instrumentation is slow and both
      # entries run the same code.  The snapshot runs uninstrumented.
      - name: Install undercover
        if: matrix.emacs == '30.1'
        run: >-
          emacs -Q --batch --eval "(progn (require 'package)
          (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\"))
          (package-initialize) (package-refresh-contents) (package-install 'undercover))"
      - name: Run tests
        env:
          # ERT writes gtags-mode-tests.xml next to the test file.
          EMACS_TEST_JUNIT_REPORT: 1
        run: >-
          emacs -Q --batch -f package-activate-all -L . -l gtags-mode-tests.el
          -f ert-run-tests-batch-and-exit
      - name: Report tests
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: gtags-mode-tests.xml
          check_name: tests (Emacs ${{ matrix.emacs }})
          include_passed: true
          detailed_summary: true
      - name: Report coverage
        if: always() && hashFiles('coverage.info') != ''
        run: |
          awk -F'[:,]' '
            BEGIN { print "## Coverage\n\n| File | Lines | Coverage | Missed lines |\n|---|---|---|---|" }
            /^SF:/ { file = substr($0, 4); sub(".*/", "", file); n = c = 0; missed = "" }
            /^DA:/ { n++; if ($3 > 0) c++; else missed = missed (missed ? ", " : "") $2 }
            /^end_of_record/ { printf "| %s | %d/%d | %.1f%% | %s |\n", file, c, n, 100 * c / n, missed }
          ' coverage.info >> "$GITHUB_STEP_SUMMARY"
      # undercover writes absolute paths; Coveralls maps paths relative
      # to the repository root onto the sources.
      - name: Make coverage paths relative
        if: always() && hashFiles('coverage.info') != ''
        run: sed -i "s|^SF:$GITHUB_WORKSPACE/|SF:|" coverage.info
      - name: Upload coverage to Coveralls
        if: always() && hashFiles('coverage.info') != ''
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.info
          format: lcov
          # A Coveralls outage must not fail the tests.
          fail-on-error: false
